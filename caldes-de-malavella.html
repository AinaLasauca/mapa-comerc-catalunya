async function obre(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(X.iv)},k,b64(X.dades)));
  document.open();document.write(t);document.close();
}
